<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Scan Barcode Produk - Pro Version</title>
  <meta name="theme-color" content="#0f172a" />
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    /* CSS ASLI DIPERTAHANKAN & DITAMBAH */
    :root {
      --bg: #08111f; --bg-2: #0f172a; --card: rgba(15, 23, 42, 0.78); --card-2: rgba(30, 41, 59, 0.78);
      --text: #f8fafc; --muted: #94a3b8; --line: rgba(148, 163, 184, 0.22);
      --blue: #38bdf8; --blue-2: #0284c7; --green: #34d399; --yellow: #facc15;
      --red: #fb7185; --purple: #a78bfa; --shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
      --radius: 24px; --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; min-height: 100vh; color: var(--text); font-family: Inter, system-ui, sans-serif; background: linear-gradient(145deg, #020617 0%, #08111f 45%, #0f172a 100%); overflow-x: hidden; padding-bottom: calc(118px + var(--safe-bottom)); }
    
    /* Layout Login */
    #authScreen { position: fixed; inset: 0; z-index: 1000; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-card { width: min(400px, 100%); background: var(--card); border: 1px solid var(--line); padding: 30px; border-radius: var(--radius); backdrop-filter: blur(20px); }
    
    /* Utility */
    .hidden { display: none !important; }
    .app { width: min(1120px, calc(100% - 28px)); margin: 0 auto; padding: 22px 0 0; }
    .card { border: 1px solid var(--line); background: var(--card); border-radius: var(--radius); padding: 18px; margin-bottom: 18px; backdrop-filter: blur(20px); }
    .input { width: 100%; min-height: 50px; border-radius: 17px; border: 1px solid var(--line); background: rgba(15, 23, 42, .72); color: var(--text); padding: 0 14px; margin-bottom: 15px; outline: none; }
    .primary-btn, .green-btn { width: 100%; min-height: 50px; border-radius: 17px; font-weight: bold; cursor: pointer; color: white; border: none; }
    .primary-btn { background: linear-gradient(135deg, var(--blue), var(--purple)); }
    .green-btn { background: var(--green); color: #064e3b; }
    .danger-btn { background: rgba(251, 113, 133, 0.1); color: var(--red); border: 1px solid var(--red); border-radius: 15px; padding: 10px; cursor: pointer; }

    /* Scanner Header Input */
    .scanner-overlay-input { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 10; }
    #reader { position: relative; border-radius: 20px; overflow: hidden; background: #000; }

    /* CSS Dari versi sebelumnya tetap ada (Style-style tombol, list, dll) */
    .topbar-inner { display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--line); background: rgba(2, 6, 23, 0.55); border-radius: 999px; padding: 10px 16px; margin-bottom: 20px; }
    .product-row { display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--line); padding: 12px; border-radius: 15px; margin-bottom: 8px; background: var(--card-2); }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 500; display: none; align-items: center; justify-content: center; padding: 15px; backdrop-filter: blur(10px); }
    .modal.active { display: flex; }
    .modal-card { width: min(500px, 100%); background: var(--bg-2); border-radius: 24px; padding: 20px; border: 1px solid var(--line); }
    .scan-fab-wrap { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 100; }
    .scan-fab { padding: 15px 40px; border-radius: 50px; background: var(--blue); color: white; font-weight: bold; box-shadow: 0 10px 30px rgba(56,189,248,0.4); }
  </style>
</head>
<body>

  <div id="authScreen">
    <div class="auth-card">
      <h2 id="authTitle">Login Akun Toko</h2>
      <p id="authSub" style="color: var(--muted); margin-bottom: 20px;">Masuk untuk akses database produk Anda.</p>
      <input type="text" id="userInp" class="input" placeholder="Username" />
      <input type="password" id="passInp" class="input" placeholder="Password" />
      <button class="primary-btn" id="loginBtn">Masuk</button>
      <p style="text-align:center; margin-top:15px; font-size:14px;">
        Belum punya akun? <a href="#" id="toggleAuth" style="color:var(--blue)">Daftar Baru</a>
      </p>
    </div>
  </div>

  <main id="mainApp" class="app hidden">
    <header class="topbar-inner">
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="width:35px; height:35px; background:var(--blue); border-radius:10px;"></div>
        <div>
          <h1 style="font-size:16px; margin:0;">Cek Harga <span id="displayUser" style="color:var(--blue)"></span></h1>
        </div>
      </div>
      <button class="danger-btn" id="logoutBtn">Keluar</button>
    </header>

    <section class="card">
      <div style="display:flex; justify-content:space-between;">
        <div>
          <h3 id="totalProductStat">0</h3>
          <p style="font-size:12px; color:var(--muted);">Total Produk</p>
        </div>
        <div style="text-align:right;">
          <h3 id="totalValueStat">Rp0</h3>
          <p style="font-size:12px; color:var(--muted);">Nilai Aset</p>
        </div>
      </div>
    </section>

    <div class="card" id="priceDisplay">
      <div id="emptyResult">Scan produk untuk lihat harga.</div>
      <div id="foundProduct" class="hidden">
        <span id="foundBarcode" class="tag"></span>
        <h2 id="foundName"></h2>
        <h1 id="foundSellPrice" style="color:var(--green)"></h1>
        <p style="font-size:14px; color:var(--muted)">Harga Beli: <span id="foundBuyPrice"></span></p>
        <button class="primary-btn" id="editFoundBtn" style="margin-top:10px;">Edit Data</button>
      </div>
    </div>

    <div class="card">
      <input type="text" id="searchInput" class="input" placeholder="Cari Nama / Barcode..." style="margin-bottom:10px;">
      <button class="green-btn" id="addProductBtn">+ Tambah Produk Manual</button>
      <div id="productList" style="margin-top:20px;"></div>
    </div>
  </main>

  <div class="modal" id="scannerModal">
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
        <strong>Scanner Aktif</strong>
        <button id="closeScannerBtn" style="background:none; color:white; font-size:20px;">✕</button>
      </div>
      
      <div style="position:relative;">
        <div class="scanner-overlay-input">
          <input type="text" id="scannerTypeName" class="input" placeholder="Atau ketik nama produk di sini..." style="background: rgba(15,23,42,0.9); border: 2px solid var(--blue);">
        </div>
        <div id="reader"></div>
      </div>

      <div style="margin-top:15px;">
        <input type="text" id="manualBarcodeInput" class="input" placeholder="Input Barcode Manual...">
        <button class="primary-btn" id="manualCheckBtn">Cek Barcode</button>
      </div>
    </div>
  </div>

  <div class="modal" id="productModal">
    <div class="modal-card">
      <h3 id="productModalTitle">Tambah Produk</h3>
      <form id="productForm">
        <input type="hidden" id="editingBarcodeOriginal" />
        <label style="font-size:12px;">Barcode</label>
        <input type="text" id="barcodeInput" class="input" required />
        <label style="font-size:12px;">Nama Produk</label>
        <input type="text" id="nameInput" class="input" required />
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
          <div><label style="font-size:12px;">Harga Beli</label><input type="text" id="buyPriceInput" class="input" required /></div>
          <div><label style="font-size:12px;">Harga Jual</label><input type="text" id="sellPriceInput" class="input" required /></div>
        </div>
        <button type="submit" class="green-btn">Simpan ke Cloud</button>
        <button type="button" class="primary-btn" id="closeProductBtn" style="margin-top:10px; background:var(--card-2)">Batal</button>
        <button type="button" class="danger-btn" id="deleteFromModalBtn" style="margin-top:10px; width:100%; display:none;">Hapus Produk</button>
      </form>
    </div>
  </div>

  <div class="scan-fab-wrap">
    <button class="scan-fab" id="scanBtn">SCAN BARCODE</button>
  </div>

  <script>
    // --- STATE MANAGEMENT ---
    let products = {};
    let currentUser = localStorage.getItem("user_session") || null;
    let isRegisterMode = false;
    let html5QrCode = null;
    let scanLock = false;

    const el = (id) => document.getElementById(id);

    // --- AUTH LOGIC ---
    el("toggleAuth").onclick = () => {
      isRegisterMode = !isRegisterMode;
      el("authTitle").innerText = isRegisterMode ? "Daftar Akun Baru" : "Login Akun Toko";
      el("authSub").innerText = isRegisterMode ? "Buat akun untuk mulai mengelola toko." : "Masuk untuk akses database produk Anda.";
      el("loginBtn").innerText = isRegisterMode ? "Daftar Sekarang" : "Masuk";
      el("toggleAuth").innerText = isRegisterMode ? "Sudah punya akun? Login" : "Daftar Baru";
    };

    el("loginBtn").onclick = async () => {
      const u = el("userInp").value.trim();
      const p = el("passInp").value.trim();
      if(!u || !p) return alert("Isi username & password");

      const action = isRegisterMode ? 'register' : 'login';
      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          body: JSON.stringify({ action, u, p })
        });
        const data = await res.json();
        if(data.success) {
          currentUser = u;
          localStorage.setItem("user_session", u);
          initApp();
        } else {
          alert(data.message);
        }
      } catch (e) { alert("Server error"); }
    };

    el("logoutBtn").onclick = () => {
      localStorage.removeItem("user_session");
      location.reload();
    };

    // --- APP LOGIC ---
    function initApp() {
      if(!currentUser) return;
      el("authScreen").classList.add("hidden");
      el("mainApp").classList.remove("hidden");
      el("displayUser").innerText = `@${currentUser}`;
      loadData();
    }

    async function loadData() {
      try {
        const res = await fetch(`/api/data?u=${currentUser}`);
        products = await res.json();
        renderAll();
      } catch (e) { toast("Error", "Gagal load data"); }
    }

    async function syncToServer() {
      try {
        await fetch(`/api/data?u=${currentUser}`, {
          method: 'POST',
          body: JSON.stringify(products)
        });
        renderAll();
      } catch (e) { toast("Error", "Gagal sinkronisasi"); }
    }

    // --- SCANNER WITH TYPE-SEARCH ---
    el("scannerTypeName").oninput = (e) => {
      const q = e.target.value.toLowerCase();
      if(q.length < 2) return;
      // Cari produk berdasarkan nama saat ngetik di scanner
      const found = Object.values(products).find(p => p.name.toLowerCase().includes(q));
      if(found) {
        toast("Ditemukan!", found.name);
        handleScannedCode(found.barcode);
      }
    };

    async function openScanner() {
      el("scannerModal").classList.add("active");
      el("scannerTypeName").value = "";
      if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
      try {
        await html5QrCode.start({ facingMode: "environment" }, {
          fps: 10, qrbox: { width: 260, height: 100 },
          experimentalFeatures: { useBarCodeDetectorIfSupported: true }
        }, (txt) => {
          if (scanLock) return;
          scanLock = true;
          handleScannedCode(txt);
        });
      } catch (e) { toast("Kamera Error", "Gagal akses kamera"); }
    }

    async function closeScanner() {
      el("scannerModal").classList.remove("active");
      scanLock = false;
      if (html5QrCode) { try { await html5QrCode.stop(); } catch(e){} }
    }

    function handleScannedCode(code) {
      const barcode = code.trim();
      closeScanner();
      if(products[barcode]) {
        showProductResult(products[barcode]);
      } else {
        openProductModal(null, barcode);
        toast("Baru", "Barcode belum terdaftar");
      }
    }

    // --- REUSE OLD LOGIC (DIPERTAHANKAN) ---
    function showProductResult(p) {
      currentFoundBarcode = p.barcode;
      el("emptyResult").classList.add("hidden");
      el("foundProduct").classList.remove("hidden");
      el("foundBarcode").innerText = p.barcode;
      el("foundName").innerText = p.name;
      el("foundSellPrice").innerText = rupiah(p.sellPrice);
      el("foundBuyPrice").innerText = rupiah(p.buyPrice);
    }

    function openProductModal(p = null, pre = "") {
      el("productForm").reset();
      el("productModal").classList.add("active");
      if(p) {
        el("productModalTitle").innerText = "Edit Produk";
        el("editingBarcodeOriginal").value = p.barcode;
        el("barcodeInput").value = p.barcode;
        el("nameInput").value = p.name;
        el("buyPriceInput").value = p.buyPrice;
        el("sellPriceInput").value = p.sellPrice;
        el("deleteFromModalBtn").style.display = "block";
      } else {
        el("productModalTitle").innerText = "Tambah Produk";
        el("barcodeInput").value = pre;
        el("deleteFromModalBtn").style.display = "none";
      }
    }

    el("productForm").onsubmit = (e) => {
      e.preventDefault();
      const b = el("barcodeInput").value.trim();
      const n = el("nameInput").value.trim();
      const bp = parseMoney(el("buyPriceInput").value);
      const sp = parseMoney(el("sellPriceInput").value);
      
      const oldB = el("editingBarcodeOriginal").value;
      if(oldB && oldB !== b) delete products[oldB];
      
      products[b] = { barcode: b, name: n, buyPrice: bp, sellPrice: sp, updatedAt: new Date().toISOString() };
      syncToServer();
      el("productModal").classList.remove("active");
      toast("Berhasil", "Data disimpan ke cloud");
    };

    // --- UTILS ---
    function renderAll() {
      const list = Object.values(products);
      el("totalProductStat").innerText = list.length;
      el("totalValueStat").innerText = rupiah(list.reduce((s,i)=>s+Number(i.sellPrice),0));
      
      const query = el("searchInput").value.toLowerCase();
      el("productList").innerHTML = list
        .filter(i => i.name.toLowerCase().includes(query) || i.barcode.includes(query))
        .map(i => `
          <div class="product-row" onclick="showProductResult(products['${i.barcode}'])">
            <div>
              <strong>${i.name}</strong><br><small>${i.barcode}</small>
            </div>
            <div style="text-align:right">
              <div style="color:var(--green)">${rupiah(i.sellPrice)}</div>
              <button class="tag" onclick="event.stopPropagation(); openProductModal(products['${i.barcode}'])">Edit</button>
            </div>
          </div>
        `).join("");
    }

    function rupiah(v) { return new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(v); }
    function parseMoney(v) { return Number(String(v).replace(/[^0-9]/g, "")); }
    function toast(t, m) { alert(`${t}: ${m}`); } // Sederhanakan untuk demo, bisa pakai CSS Toast kamu yang lama

    // INIT
    if(currentUser) initApp();
    el("scanBtn").onclick = openScanner;
    el("closeScannerBtn").onclick = closeScanner;
    el("addProductBtn").onclick = () => openProductModal();
    el("closeProductBtn").onclick = () => el("productModal").classList.remove("active");
    el("searchInput").oninput = renderAll;
  </script>
</body>
</html>
